[build]
  # Build command - uses legacy peer deps to resolve dependency conflicts
  command = "npm install --legacy-peer-deps && npm run build"
  
  # Publish directory - where the built files are located
  publish = "dist/public"
  
  # Functions directory (optional, if using Netlify functions)
  # functions = "netlify/functions"

[build.environment]
  # Node.js version
  NODE_VERSION = "20"

# Redirects for single-page application
# All routes should serve index.html to allow client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
